name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check lib/index.js
      - run: node --check lib/client.js
      - run: npm test
  # Real-host smoke test: calls the actual collectors against the runner's own OS and prints what the panel would show.
  smoke:
    name: smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/smoke.mjs
      - run: node test/hosts.smoke.mjs
  # Windows PowerShell 5.1 is the only shell on most Windows machines (the runner also has pwsh 7, which the
  # collector prefers). Force the fallback so the 5.1 code path is exercised too.
  smoke-ps51:
    name: smoke · Windows PowerShell 5.1
    runs-on: windows-latest
    env:
      DSR_SHELL: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/smoke.mjs
      - run: node test/hosts.smoke.mjs
  # A container has an overlay '/', which the Linux collector used to filter out, leaving the panel with no disks.
  smoke-container:
    name: smoke · Linux container
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@v4
      - run: node test/smoke.mjs
